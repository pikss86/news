services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news}
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  collector:
    build:
      context: .
      args:
        TDLIB_GIT_REF: ${TDLIB_GIT_REF:-022d60202e446ad1287b9fb68e687c8a0760788b}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE_NUMBER: ${TELEGRAM_PHONE_NUMBER}
      TELEGRAM_DATABASE_ENCRYPTION_KEY: ${TELEGRAM_DATABASE_ENCRYPTION_KEY:-}
      TDLIB_DATA_DIR: /var/lib/tdlib
      TDLIB_LIBRARY_PATH: /usr/local/lib/libtdjson.so
      TDLIB_LOG_VERBOSITY: ${TDLIB_LOG_VERBOSITY:-2}
      TELEGRAM_DOWNLOAD_MEDIA: ${TELEGRAM_DOWNLOAD_MEDIA:-false}
      TELEGRAM_MEDIA_DOWNLOAD_PRIORITY: ${TELEGRAM_MEDIA_DOWNLOAD_PRIORITY:-16}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stdin_open: true
    tty: true
    volumes:
      - tdlib_data:/var/lib/tdlib

volumes:
  postgres_data:
  tdlib_data:
