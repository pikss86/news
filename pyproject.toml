[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-telegram-collector"
version = "0.1.0"
description = "Provenance-preserving Telegram ingestion collector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-json-logger>=2,<4",
  "sqlalchemy[asyncio]>=2.0.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
